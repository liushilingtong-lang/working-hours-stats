name: Build Windows & Android

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  # ============================================================
  # Windows: Electron .exe
  # ============================================================
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Electron app
        run: npm run build:win
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload portable exe
        uses: actions/upload-artifact@v4
        with:
          name: Windows-便携版
          path: dist/工作时间统计_*_便携版.exe

  # ============================================================
  # Android: APK via Capacitor
  # ============================================================
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        run: |
          # Use pre-installed SDK, unset conflicting var
          echo "ANDROID_SDK_ROOT=" >> $GITHUB_ENV
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install dependencies
        run: npm ci

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets
        run: npx cap sync android

      - name: Generate Android icons
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
          SRC="assets/icon.png"
          RES="android/app/src/main/res"
          for PAIR in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            NAME="${PAIR%%:*}" SIZE="${PAIR##*:}"
            DIR="$RES/mipmap-$NAME"
            mkdir -p "$DIR"
            convert "$SRC" -resize "${SIZE}x${SIZE}" "$DIR/ic_launcher.png"
            echo "mipmap-$NAME ($SIZE x $SIZE)"
          done

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

  # ============================================================
  # Release
  # ============================================================
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Windows-便携版/*
            Android-APK/*
          draft: false
          prerelease: false
          generate_release_notes: true
